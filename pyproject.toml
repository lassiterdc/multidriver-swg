[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multidriver-swg"
version = "0.1.0"
description = "Stochastic weather generator producing multi-driver flood forcing (rainfall + storm surge + tidal phase) by resampling and rescaling historic events to match randomly generated event statistics"
authors = [
    {name = "Daniel Lassiter", email = "daniel.lassiter@outlook.com"},
]
requires-python = ">= 3.11"
readme = "README.md"
# NOTE: do NOT add a `License :: ...` trove classifier. With PEP 639
# `license = "PolyForm-Noncommercial-1.0.0"` + setuptools>=77, a legacy License
# classifier raises setuptools InvalidConfigError at build time (verified in hhemt).
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]

[project.optional-dependencies]
docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", "build", "dist", "*.egg-info"]
