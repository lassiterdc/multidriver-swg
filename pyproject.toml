[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multidriver-swg"
version = "0.2.0.dev0"
description = "Stochastic weather generator producing multi-driver flood forcing (rainfall + storm surge + tidal phase) by resampling and rescaling historic events to match randomly generated event statistics"
authors = [
    {name = "Daniel Lassiter", email = "daniel.lassiter@outlook.com"},
]
requires-python = ">= 3.11"
# The scan's set: `numpy` and `snakemake` are the only third-party imports under `src/`. The `numpy`
# constraint is the floor the install check installs (`--resolution lowest-direct`) and the closing one a
# major bump would cross; `snakemake` stays pinned to the engine version the workflow command starts.
# `pandas` and `xarray` are the test environment's, declared in the `test` group below: no module under
# `src/` imports either, and a runtime declaration that carries them installs two libraries a user of this
# package never imports.
dependencies = ["numpy>=2,<3", "snakemake==9.15.0"]
readme = "README.md"
# NOTE: do NOT add a `License :: ...` trove classifier. With PEP 639
# `license = "AGPL-3.0-or-later"` + setuptools>=77, a legacy License
# classifier raises setuptools InvalidConfigError at build time (verified in hhemt).
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]

[project.scripts]
multidriver-swg = "multidriver_swg.workflow.cli:main"

[project.optional-dependencies]
docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
]
hpc = [
    "snakemake-executor-plugin-slurm==2.8.0",
]

# The suite's environment, declared once. Every stored value under
# `tests/correspondence/reference_values/` records in its `[diagnostics]` table the versions it was
# computed under, and a value computed under another version is a moved environment rather than a
# divergence, so those versions decide what the suite's red means. The four reference distributions
# and the runner are therefore pinned to what the stores record, `tzdata` and `netCDF4` to what the
# reference-environment re-run resolved (the runner lacked both: the legacy code asks `zoneinfo` for
# `EST`, and `xarray` without `netCDF4` writes a `zlib` encoding only its `scipy` backend reads), and
# `uv`, `build` and `setuptools` to the versions the new tests execute. Both suite jobs install this
# group instead of listing distributions of their own, and `tests/test_test_environment.py` holds the
# two declarations equal. Transitive dependencies stay resolved and not pinned until the lock.
[dependency-groups]
test = [
    "numpy==2.4.6",
    "pandas==2.3.3",
    "xarray==2026.9.0",
    "scipy==1.17.1",
    "pytest==9.1.1",
    "matplotlib==3.11.2",
    "seaborn==0.13.2",
    "python-dateutil==2.9.0.post0",
    "pyvinecopulib==1.0.1",
    "scikit-learn==1.9.1",
    "tqdm==4.70.1",
    "tzdata==2026.6",
    "netCDF4==1.7.5.1.post1",
    "uv==0.11.31",
    "build==1.6.1",
    "setuptools==84.2.1",
]

# The divergence ledger and the workflow file are data the package reads at run time, so they ship in the
# wheel; setuptools ships only Python modules by default. The Snakefile is copied with the package's own
# data because the command starts the engine with the installed file's path.
[tool.setuptools.package-data]
multidriver_swg = ["divergence_ledger.toml", "workflow/Snakefile"]

# The cutoff the release lock renders at: `scripts/render_lock.py` reads this value with `tomllib` and
# passes it to `uv pip compile` as `--exclude-newer`, and uv itself reads it for any `uv pip` command
# run in the project. A resolution is reproducible only at a fixed cutoff, so this is the one
# statement of the date every committed lock byte was resolved at; moving it is a lock regeneration,
# not an edit.
[tool.uv.pip]
exclude-newer = "2026-11-16T00:00:00Z"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", "build", "dist", "*.egg-info"]
markers = [
    "state_check: a check of the pre-refactor correspondence that the State check CI job runs; carrying this marker is all a check needs to join that job",
    "conformance(unit, system, part): a publication-math conformance test, owned by the publication-math-conformance system; its unit names the equation or component and its part the test function",
]
strict_markers = true
