# Anonymization guard: fails if any tracked file contains a blocklisted
# genuinely-private identifier (scripts/anonymization_blocklist.txt).
# Working-tree scrub enforcement; git HISTORY exposure is a separate concern.
#
# The guard reports a finding by BLOCKLIST INDEX rather than by token text, so
# a failing run here no longer discloses the identifier. The tracked blocklist
# additionally carries only tokens that already occur in this public tree; the
# prophylactic half lives outside the repo and is absent in CI by design.
name: Anonymization guard

on:
  # Every branch, not just the integration branches. A push to ANY branch of a
  # public repo is the moment content becomes public, so a backstop that only
  # watches main/develop does not cover the branch where most work is pushed.
  # This does not make the control preventive -- nothing CI-side can be, given
  # the ordering -- but detection within a minute on every branch beats
  # detection only on arrival at develop.
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read

jobs:
  anonymization-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert the public surface carries no developer cruft
        shell: bash
        run: |
          set -uo pipefail
          fail=0
          for f in scripts/anonymization_blocklist.txt scripts/anonymization_baseline.txt; do
            [ -f "$f" ] || continue
            n=$(grep -cvE '^[[:space:]]*(#|$)' "$f")
            if [ "$n" -ne 0 ]; then
              echo "public-surface: $f carries $n non-comment line(s); it must be prose-only" >&2
              fail=1
            fi
          done
          allow='^(\.copier-answers\.yml|_old_code_to_refactor/_inputs\.py)$'
          pat='(/home/[A-Za-z0-9._-]+|/Users/[A-Za-z0-9._-]+|\b[A-Za-z]:[\\/]|Dropbox|OneDrive|Google Drive|iCloud)'
          hits=0
          while IFS= read -r -d '' f; do
            printf '%s' "$f" | grep -qE "$allow" && continue
            if grep -aqE "$pat" "$f" 2>/dev/null; then
              echo "public-surface: $f matches a local-path pattern" >&2
              hits=$((hits+1))
            fi
          done < <(git ls-files -z)
          [ "$hits" -eq 0 ] || fail=1
          echo "public-surface: control-file token lines checked; $hits pattern finding(s) outside the allowlist"
          exit $fail
