# Anonymization guard: fails if any tracked file contains a blocklisted
# genuinely-private identifier (scripts/anonymization_blocklist.txt).
# Working-tree scrub enforcement; git HISTORY exposure is a separate concern.
#
# The guard reports a finding by BLOCKLIST INDEX rather than by token text, so
# a failing run here no longer discloses the identifier. The tracked blocklist
# additionally carries only tokens that already occur in this public tree; the
# prophylactic half lives outside the repo and is absent in CI by design.
name: Anonymization guard

on:
  # Every branch, not just the integration branches. A push to ANY branch of a
  # public repo is the moment content becomes public, so a backstop that only
  # watches main/develop does not cover the branch where most work is pushed.
  # This does not make the control preventive -- nothing CI-side can be, given
  # the ordering -- but detection within a minute on every branch beats
  # detection only on arrival at develop.
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read

jobs:
  anonymization-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run anonymization guard
        run: python scripts/check_anonymization.py
