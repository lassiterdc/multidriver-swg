# Anonymization guard: fails if any tracked file contains a blocklisted
# genuinely-private identifier (scripts/anonymization_blocklist.txt).
# Working-tree scrub enforcement; git HISTORY exposure is a separate concern.
#
# NOTE: this repository is PUBLIC, so this workflow's logs are public. The guard
# prints the offending path, line, and token — so a FAILING run here discloses
# the very identifier it guards. The pre-commit hook is therefore the primary
# gate; this workflow is the backstop for commits that bypass it.
name: Anonymization guard

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read

jobs:
  anonymization-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run anonymization guard
        run: python scripts/check_anonymization.py
