# State check. On every push to every branch, and on pull requests to main and
# develop, this job runs the state checks of the pre-refactor correspondence:
# every test that carries the `state_check` marker, which pyproject.toml
# registers. A later check joins this job by carrying that marker, with no edit
# here. The equivalence tests never carry it, because they stay failing until
# porting ends. A repository ruleset requires this job on `main`; on every other
# branch its result is a report and stops nothing.
name: State check

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read

jobs:
  state-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the toolkit and the test runner
        run: python -m pip install --disable-pip-version-check -e . "pytest==9.1.1"
      - name: Run the state checks
        run: python -m pytest -m "state_check and not equivalence and not refactor_reminder" -p no:cacheprovider -ra
