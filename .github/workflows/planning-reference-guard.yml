# Planning-reference guard. On every push to every branch, and on pull requests,
# this job runs the scanner's own tests (every pattern must fire on its control
# and stay silent on ordinary text), then scans the whole tree. It needs only
# Python and pytest, so it runs before any project environment exists.
name: Planning-reference guard

on:
  push:
  pull_request:

jobs:
  planning-reference-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Scanner self-test
        run: python -m pytest -q -p no:cacheprovider --noconftest tests/test_planning_references.py
      - name: Scan the tree
        run: python3 scripts/check_planning_references.py
