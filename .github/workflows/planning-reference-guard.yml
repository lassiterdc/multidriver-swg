# Planning-reference guard. On every push to every branch and every tag, and on
# pull requests, this job runs the content scanner's own tests (every pattern
# must fire on its control and stay silent on ordinary text), then scans the
# whole tree with the scanner's planning-reference class. It needs only Python
# and pytest, so it runs before any project environment exists.
#
# The scan inherits the scanner's report form, so on this runner it prints one
# count line and no location. The hook configuration runs the same class with
# the located form on a developer's machine, which is where a finding is read.
name: Planning-reference guard

on:
  push:
    branches: [ "**" ]
    # A tag push publishes the tree as surely as a branch push does, and a release tag is the
    # one push whose content a stranger downloads first, so this job watches tags too.
    tags: [ "**" ]
  pull_request:

jobs:
  planning-reference-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Scanner self-test
        run: python -m pytest -q -p no:cacheprovider --noconftest tests/test_content_scan.py
      - name: Scan the tree
        run: python3 scripts/content_scan --class planning_reference
