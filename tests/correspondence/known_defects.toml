rule = "known-defect-register:1"
examined_scope = "Every unit of the ten retained legacy scripts that had no ruling before this examination, 157 units, each examined by reading it; the discarded water-level generator script was not examined, and a defect in a unit ruled discard is not entered."
examination_command = "An AST walk of every retained legacy file listing each sys.exit call not nested in an if, try or except block, which is a stop marker, and each call of a random draw (sample, choice, uniform, randint, normal, rvs, shuffle, permutation, random, standard_normal or simulate) passing no random_state, seed, seeds, rng or generator keyword other than None, which is an unseeded draw; every other entry comes from reading each unit."
statement = "The register lists the defects found by examining every unit of the ten retained legacy scripts that had no ruling before the examination, each entry with its ruling. An entry ruled OBLIGED is a defect the new code must still be able to reproduce, under the method that preserves the legacy behaviour, so that results made with the legacy code can be reproduced and the defect's effect on them measured; the ruling does not make the defect the behaviour a regular method of the new code is meant to have. An entry ruled LICENSED is one the new code departs from, with the departure recorded in the divergence ledger."
# one [[entry]] per defect:
# key = "{unit key}", line = {line inside the unit}, defect = "{text}", kind = "{text}",
# ruling = "OBLIGED" | "LICENSED" | "UNRULED", reason = "{text}", equation = "{the publication-math-conformance system's identifier for the equation, optional}"

[[entry]]
key = "__ref_ams_functions.py:111-214"
line = 158
defect = "The log-likelihood of a three-parameter fit is the logarithm of the product of the densities, which underflows to zero for a sample of a few hundred values, and is zero at any sample size when the location is fixed at the sample minimum and the density vanishes at that bound; either way the log-likelihood is minus infinity and the AIC infinite."
kind = "found by reading"
ruling = "LICENSED"
reason = "The AIC is a score of the fit, and a value made infinite by underflow rather than by the fit's quality reports nothing; the new code computes it from the sum of the log-densities."

