# The § B2 binding ledger: one table per register equation, stating what this repository owes it.
#
# A row's `binding` is one of four wire values — TEST, CROSS-REPO, UNREACHABLE, NO-MANUSCRIPT-TEXT —
# and its `ground` quotes the § B2 Status fragment that decides which. `test` is present exactly on a
# TEST row and names the conformance function; the function's own marker must name the same equation
# id and the function must live under tests/conformance/, which `bindings.coverage_findings` checks.
#
# The landed `Binding` and the reachability flag are DERIVED by `bindings.py` and never written here:
# one fact with two homes is a fact that can be stated two ways. A row that writes either one is
# refused by name, so the ledger cannot acquire a second answer to a question it already answers.
#
# Grounds are TOML literal strings ('''...''') because § B2's Status column carries LaTeX, and a
# basic string would read `\t` in `$D_{\text{thresh}}$` as a tab and corrupt the quote it carries.

